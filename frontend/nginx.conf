server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # ES-module assets (pdf.js worker) — nginx's default mime.types has no .mjs entry,
  # and browsers refuse module scripts served as application/octet-stream.
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://backend:__BACKEND_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    # Uploads: LinkedIn ZIP exports and CV PDFs exceed nginx's 1 MB default.
    client_max_body_size 50m;
  }

  location /health {
    proxy_pass http://backend:__BACKEND_PORT__/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
